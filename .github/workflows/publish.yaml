name: Publish image to Docker hub
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        default: latest
        description: image tag
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: License Check
        run: mvn license:check

      - name: Run Build
        run: mvn clean install -DskipTests -Pdocker

      - name: Push image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag lakestream/streaming-proof:latest lakestream/streaming-proof:${SHORT_SHA}

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.tag }}" != "latest" ]]; then
            docker tag lakestream/streaming-proof:latest lakestream/streaming-proof:${{ inputs.tag }}
            docker push lakestream/streaming-proof:${{ inputs.tag }}
          fi

          docker push lakestream/streaming-proof:latest
          docker push lakestream/streaming-proof:${SHORT_SHA}
