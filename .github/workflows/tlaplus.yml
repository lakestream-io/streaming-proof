name: TLA+ Model Checking

on:
  push:
    branches: [ main ]
    paths:
      - 'common/src/main/java/**'
      - 'coordinator/src/main/java/**'
      - 'worker/src/main/java/**'
      - 'tlaplus/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'common/src/main/java/**'
      - 'coordinator/src/main/java/**'
      - 'worker/src/main/java/**'
      - 'tlaplus/**'

jobs:
  tlaplus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - SeqRangeMerge
          - GapDetection
          - DuplicateCounting
          - OrderingVerification
          - WatermarkComputation
          - CheckpointVerification
          - CheckpointVerificationShared
          - CoordinatorWorker

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache tla2tools.jar
      uses: actions/cache@v4
      with:
        path: tlaplus/ci/tla2tools.jar
        key: tla2tools-v1.8.0

    - name: Download tla2tools.jar
      run: |
        if [ ! -f tlaplus/ci/tla2tools.jar ]; then
          curl -sL -o tlaplus/ci/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
        fi

    - name: Run TLC - ${{ matrix.spec }}
      run: bash tlaplus/ci/run-tlc.sh --spec ${{ matrix.spec }}
