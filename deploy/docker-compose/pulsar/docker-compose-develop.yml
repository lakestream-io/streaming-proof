version: '3.8'

services:
  coordinator:
    image: lakestream/streaming-proof:latest
    command: bin/coordinator
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - HEAP_OPTS=-Xms1G -Xmx1G
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ../../volumes/configs:/mnt/streaming-proof/configs
  worker:
    image: lakestream/streaming-proof:latest
    command: bin/worker
    ports:
      - "8088:8088"
      - "5006:5005"
    environment:
      - HEAP_OPTS=-Xms1G -Xmx1G
      - JVM_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      pulsar:
        condition: service_healthy
  pulsar:
    image: apachepulsar/pulsar:4.0.3
    command: bin/pulsar standalone
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s