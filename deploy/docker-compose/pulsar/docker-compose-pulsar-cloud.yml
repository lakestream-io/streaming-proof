version: '3.8'

services:
  coordinator:
    image: lakestream/streaming-proof:latest
    command: bin/coordinator
    ports:
      - "8080:8080"
    environment:
      - HEAP_OPTS=-Xms1G -Xmx1G
  worker:
    image: lakestream/streaming-proof:latest
    command: bin/worker
    ports:
      - "8088:8088"
    environment:
      - HEAP_OPTS=-Xms1G -Xmx1G
    depends_on:
      - coordinator
