# Default values for streaming-proof
namespace: streaming-proof

coordinator:
  replicas: 1
  image:
    repository: streamnative/streaming-proof
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 8080
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: external
  # Allow overriding nodeSelector and tolerations for different environments
  nodeSelector: {}
  tolerations:
    - effect: NoSchedule
      key: karpenter.sh/capacity-type
      operator: Equal
      value: spot

worker:
  replicas: 3
  image:
    repository: streamnative/streaming-proof
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  # Allow overriding nodeSelector and tolerations for different environments
  nodeSelector: {}
  tolerations:
    - effect: NoSchedule
      key: karpenter.sh/capacity-type
      operator: Equal
      value: spot

frontend:
  enabled: false

metadataSync:
  enabled: false

