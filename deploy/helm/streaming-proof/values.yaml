# Default values for streaming-proof
namespace: streaming-proof

coordinator:
  replicas: 1
  image:
    repository: lakestream/streaming-proof
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 8080
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: external
  # Pin to on-demand nodes so pods are never lost to spot reclamation.
  nodeSelector:
    karpenter.sh/capacity-type: on-demand
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  tolerations: []
  pdb:
    enabled: true
    maxUnavailable: 0

worker:
  replicas: 3
  image:
    repository: lakestream/streaming-proof
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  # Pin to on-demand nodes so pods are never lost to spot reclamation.
  nodeSelector:
    karpenter.sh/capacity-type: on-demand
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  tolerations: []
  pdb:
    enabled: true
    minAvailable: 3

frontend:
  enabled: false

