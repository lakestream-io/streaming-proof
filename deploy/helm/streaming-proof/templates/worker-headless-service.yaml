apiVersion: v1
kind: Service
metadata:
  name: streaming-proof-worker-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "streaming-proof.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: streaming-proof
    component: streaming-proof-worker
  ports:
    - name: http
      port: 8088
      targetPort: 8088