apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: streaming-proof-coordinator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "streaming-proof.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app: streaming-proof
      component: streaming-proof-coordinator
  template:
    metadata:
      labels:
        app: streaming-proof
        component: streaming-proof-coordinator
      annotations:
        prometheus.io/port: "8000"
        prometheus.io/scrape: "true"
        # Bypass the Istio sidecar for the externally-exposed API port so the
        # internet-facing NLB can reach it in plaintext under the mesh-wide
        # STRICT mTLS policy.
        traffic.sidecar.istio.io/excludeInboundPorts: "{{ .Values.coordinator.service.targetPort }}"
        # Bypass the sidecar for outbound calls to the worker port (8088). The
        # worker port is excluded inbound and serves plaintext, but the worker
        # pod is still labeled tlsMode=istio, so without this the coordinator's
        # sidecar would attempt mTLS and the handshake would fail (HTTP 503).
        # Broker traffic (6650/8080/9092) is unaffected and still uses mTLS.
        traffic.sidecar.istio.io/excludeOutboundPorts: "8088"
        {{- with .Values.coordinator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.configs }}
      volumes:
      - name: config-volume
        configMap:
          name: streaming-proof-configs
      {{- end }}
      {{- with .Values.coordinator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        - |
          apt-get update && apt-get install curl jq -y
          export TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600");
          export ZONE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone-id);
          export HEAP_OPTS="-Xms4G -Xmx4G -Dzone.id=${ZONE_ID}"
          bin/coordinator
        command:
        - sh
        - -c
        image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
        imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
        name: streaming-proof-coordinator
        {{- if .Values.configs }}
        volumeMounts:
        - mountPath: /mnt/streaming-proof/configs
          name: config-volume
        {{- end }}
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          {{- toYaml .Values.coordinator.resources | nindent 10 }}
