{{- if and .Values.metadataSync.enabled .Values.metadataSync.sourceNamespace }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: streaming-proof-metadata-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "streaming-proof.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.metadataSync.schedule | quote }}
  concurrencyPolicy: {{ .Values.metadataSync.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.metadataSync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.metadataSync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.metadataSync.backoffLimit }}
      template:
        metadata:
          labels:
            app: streaming-proof
            component: streaming-proof-metadata-sync
        spec:
          serviceAccountName: streaming-proof-metadata-sync
          restartPolicy: OnFailure
          containers:
            - name: streaming-proof-metadata-sync
              image: "{{ .Values.metadataSync.image.repository }}:{{ .Values.metadataSync.image.tag }}"
              imagePullPolicy: {{ .Values.metadataSync.image.pullPolicy }}
              env:
                - name: STREAMING_PROOF_NAMESPACE
                  value: {{ .Values.namespace | quote }}
                - name: STREAMING_PROOF_CONFIGMAP_NAME
                  value: {{ .Values.metadataSync.targetConfigMapName | quote }}
                - name: STREAMING_PROOF_CONFIG_KEY
                  value: {{ .Values.metadataSync.targetConfigKey | quote }}
                - name: METADATA_SOURCE_NAMESPACE
                  value: {{ .Values.metadataSync.sourceNamespace | quote }}
                - name: DRIVER_CLUSTER_MAPPINGS
                  value: {{ toJson .Values.metadataSync.driverClusterMappings | quote }}
              resources:
                {{- toYaml .Values.metadataSync.resources | nindent 16 }}
{{- end }}
