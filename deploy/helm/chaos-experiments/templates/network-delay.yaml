{{- $namespace := .Values.target.namespace }}
{{- $defaults := .Values.defaults }}
{{- $release := .Release.Name }}
{{- $config := .Values.networkDelay }}
{{- if $config.enabled }}
{{- range $cluster := $config.clusters }}
{{- if $cluster.enabled }}
{{- range $role, $cron := $cluster.roles }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: {{ include "chaos.fullname" (list $release $cluster.name "netdelay" $role) }}
  namespace: {{ $namespace }}
  labels:
    chaos.streamnative.io/experiment: network-delay
    chaos.streamnative.io/cluster: {{ $cluster.name | quote }}
    chaos.streamnative.io/role: {{ $role | quote }}
spec:
  schedule: {{ $cron | quote }}
  concurrencyPolicy: {{ $config.concurrencyPolicy }}
  historyLimit: {{ $defaults.historyLimit }}
  type: NetworkChaos
  networkChaos:
    action: delay
    mode: {{ $config.mode }}
    duration: {{ $config.duration | quote }}
    selector:
      {{- include "chaos.podSelector" (dict "namespace" $namespace "cluster" $cluster.name "role" $role) | nindent 6 }}
    delay:
      latency: {{ $config.latency | quote }}
      jitter: {{ $config.jitter | quote }}
      correlation: {{ $config.correlation | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
