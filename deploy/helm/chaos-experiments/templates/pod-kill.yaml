{{- $ns := .Values.target.namespace }}
{{- $defaults := .Values.defaults }}
{{- $release := .Release.Name }}
{{- range $inst := .Values.instances }}
{{- if $inst.enabled }}
{{- range $role, $cron := $inst.roles }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: {{ printf "%s-%s-%s-kill-one" $release $inst.name $role | trunc 63 | trimSuffix "-" }}
  namespace: {{ $ns }}
spec:
  schedule: {{ $cron | quote }}
  concurrencyPolicy: {{ $defaults.concurrencyPolicy }}
  historyLimit: {{ $defaults.historyLimit }}
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - {{ $ns }}
      labelSelectors:
        cloud.streamnative.io/pulsar-instance: {{ $inst.name | quote }}
        cloud.streamnative.io/role: {{ $role | quote }}
{{- end }}
{{- end }}
{{- end }}
