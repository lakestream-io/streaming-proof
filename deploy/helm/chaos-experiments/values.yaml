# Chaos Mesh pod-kill experiments for one or more managed Pulsar instances.
#
# IMPORTANT:
#   - Chaos Mesh must already be installed on the DATA PLANE cluster (the pool
#     member where the Pulsar pods run), NOT the control plane:
#       helm repo add chaos-mesh https://charts.chaos-mesh.org
#       helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --create-namespace
#
# Each (instance, role) pair becomes a recurring Schedule that kills ONE pod,
# matched by the pulsar-instance + role labels. Give every pair its own cron so
# the kills stay staggered.

target:
  # Namespace where the Pulsar pods run in the data plane.
  namespace: o-2h056

# Shared Schedule settings.
defaults:
  # Allow: always fire on schedule, never blocked by a previous run. Right for
  # pod-kill (instantaneous). Forbid can stall the schedule if a prior chaos
  # object gets stuck in the active state.
  concurrencyPolicy: Allow
  historyLimit: 50

# One entry per Pulsar instance. `roles` maps a cloud.streamnative.io/role value
# to its kill cron. Common role values:
#   pulsar-broker | bookkeeper | oxia
#
# Schedule design: each cluster is designed independently. Every component is
# killed every 12 minutes (5x/hour). WITHIN a cluster the components are staggered
# with >=3 minutes between any two kills. Across clusters the slots are reused -
# cross-cluster overlap is intentional and fine.
#
#   2-component cluster: offsets :00 and :06  (6 min apart)
#   3-component cluster: offsets :00, :04, :08 (4 min apart)
instances:

  - name: tiered-storage-test
    enabled: true
    roles:
      pulsar-broker: "0-59/12 * * * *"  # :00 :12 :24 :36 :48
      bookkeeper: "6-59/12 * * * *"     # :06 :18 :30 :42 :54

  - name: classic-chaos-test
    enabled: true
    roles:
      pulsar-broker: "0-59/12 * * * *"  # :00 :12 :24 :36 :48
      bookkeeper: "6-59/12 * * * *"     # :06 :18 :30 :42 :54

  - name: ursa-chaos-test
    enabled: true
    roles:
      pulsar-broker: "0-59/12 * * * *"  # :00 :12 :24 :36 :48
      oxia: "6-59/12 * * * *"           # :06 :18 :30 :42 :54

  - name: lakehouse-chaos-test
    enabled: true
    roles:
      pulsar-broker: "0-59/12 * * * *"  # :00 :12 :24 :36 :48
      bookkeeper: "4-59/12 * * * *"     # :04 :16 :28 :40 :52
      oxia: "8-59/12 * * * *"           # :08 :20 :32 :44 :56

