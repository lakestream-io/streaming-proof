# Recurring Chaos Mesh experiments for streaming-system clusters.
#
# All experiments are disabled by default. Configure the namespace and the
# labels used by your workloads before enabling any schedule.

target:
  namespace: default
  clusterLabel: app.kubernetes.io/instance
  roleLabel: app.kubernetes.io/component

defaults:
  historyLimit: 10

podKill:
  enabled: false
  concurrencyPolicy: Allow
  gracePeriod: 60
  duration: 90s
  clusters: []

podFailure:
  enabled: false
  concurrencyPolicy: Forbid
  duration: 60s
  clusters: []

networkDelay:
  enabled: false
  concurrencyPolicy: Forbid
  mode: one
  duration: 90s
  latency: 200ms
  jitter: 50ms
  correlation: "50"
  clusters: []

networkPartition:
  enabled: false
  concurrencyPolicy: Forbid
  mode: one
  duration: 90s
  direction: both
  externalTargets: []
  clusters: []
